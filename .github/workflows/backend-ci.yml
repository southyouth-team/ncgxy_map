name: Backend CI

on:
  push:
    branches:
      - feat/multi-campus-data-foundation
      - feat/object-model-protocol-p1
      - feat/img2threejs-procedural-mvp
      - feat/world-sandbox-conversational-model-editor
  pull_request:
    branches:
      - main
      - feat/multi-campus-data-foundation
      - feat/object-model-protocol-p1
      - feat/img2threejs-procedural-mvp
      - feat/world-sandbox-conversational-model-editor

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ncgxy_campus_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ncgxy_campus_map"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ncgxy_campus_map
      DB_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build NestJS
        run: npm run build
      - name: Run backend unit tests
        run: npm test -- --runInBand
      - name: Apply PostGIS migrations
        run: npm run db:migrate
      - name: Run API integration tests
        run: npm run test:e2e
      - name: Verify PostGIS schema
        run: |
          node -e "const { Client } = require('pg'); (async () => { const c = new Client({ host: process.env.DB_HOST, port: Number(process.env.DB_PORT), user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_NAME }); await c.connect(); const r = await c.query(\"SELECT to_regclass('public.campus') AS campus, to_regclass('public.campus_feature') AS feature, (SELECT count(*) FROM pg_indexes WHERE indexname='idx_feature_geometry_gist') AS spatial_index\"); await c.end(); if (!r.rows[0].campus || !r.rows[0].feature || Number(r.rows[0].spatial_index) !== 1) { console.error(r.rows[0]); process.exit(1); } console.log(r.rows[0]); })().catch(e => { console.error(e); process.exit(1); });"
