name: Frontend CI

on:
  push:
    branches: [feat/multi-campus-data-foundation]
  pull_request:
    branches: [main, feat/multi-campus-data-foundation]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
