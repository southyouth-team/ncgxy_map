teachingBlock(-12,-10,10,5.8,5.8); teachingBlock(1,-10,10,5.8,5.8,mat(0xc6a16f)); teachingBlock(13,-10,8,5.8,4.8); label('教学区',1,9,-10);

const player = new THREE.Group(); scene.add(player); player.position.set(0,0,17);
const skinMat=mat(0xf0c6a0), shirtMat=mat(0x2f7180), pantsMat=mat(0x344b5c), shoeMat=mat(0xeee9dc), backpackMat=mat(0xc68b4d);
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,8,6),skinMat);head.position.y=1.72;head.castShadow=true;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.35,8,5,0,Math.PI*2,0,Math.PI*.52),mat(0x39413d));hair.position.y=1.88;hair.castShadow=true;player.add(hair);
const torso=new THREE.Mesh(new THREE.BoxGeometry(.72,.82,.38),shirtMat);torso.position.y=1.08;torso.castShadow=true;player.add(torso);

const shadow=new THREE.Mesh(new THREE.CircleGeometry(.58,20),new THREE.MeshBasicMaterial({color:0x344b43,transparent:true,opacity:.2}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.025;player.add(shadow);
const pressedKeys=new Set();

const pad=document.createElement('div');pad.id='movePad';pad.innerHTML='<button data-k="w" class="pad up">▲</button><button data-k="a" class="pad left">◀</button><button data-k="s" class="pad down">▼</button><button data-k="d" class="pad right">▶</button>';document.body.appendChild(pad);
const padStyle=document.createElement('style');padStyle.textContent='#movePad{position:fixed;right:22px;bottom:65px;z-index:5;width:142px;height:142px;display:none;touch-action:none}#movePad .pad{position:absolute;width:43px;height:43px;padding:0;border-radius:12px;background:rgba(250,253,250,.88);font-size:15px;touch-action:none}#movePad .up{left:49px;top:0}#movePad .down{left:49px;bottom:0}#movePad .left{left:0;top:49px}#movePad .right{right:0;top:49px}@media(pointer:coarse){#movePad{display:block}#hint{max-width:190px;line-height:1.6}}#walkStatus{position:fixed;left:22px;bottom:58px;z-index:2;background:rgba(250,253,250,.82);color:#31554b;padding:7px 10px;border-radius:8px;font-size:11px}';document.head.appendChild(padStyle);

const clock=new THREE.Clock();const cameraOffset=new THREE.Vector3(0,8.5,11.5);const cameraTarget=new THREE.Vector3();
function updatePlayer(dt){
 const forward=(pressedKeys.has('w')||pressedKeys.has('arrowup')?1:0)-(pressedKeys.has('s')||pressedKeys.has('arrowdown')?1:0);

 if(moving){
  const viewForward=new THREE.Vector3();camera.getWorldDirection(viewForward);viewForward.y=0;viewForward.normalize();

  player.rotation.y=Math.atan2(move.x,move.z);const step=Math.sin(performance.now()*.014)*.11;legL.rotation.x=step;legR.rotation.x=-step;armL.rotation.x=-step*.7;armR.rotation.x=step*.7;
 }else{legL.rotation.x=THREE.MathUtils.damp(legL.rotation.x,0,10,dt);legR.rotation.x=THREE.MathUtils.damp(legR.rotation.x,0,10,dt);armL.rotation.x=THREE.MathUtils.damp(armL.rotation.x,0,10,dt);armR.rotation.x=THREE.MathUtils.damp(armR.rotation.x,0,10,dt);}
